<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="login.css">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<title>Website Login and Registration</title>
</head>
<body>
<header>
<h2 class="logo">MealTime</h2>
<nav class="navigation">
<a href="login.html">Home</a>
<a href="About.html">About Us</a>
<a href="policy.html">Terms and Conditions </a>
<button class="btnLogin-popup">Login</button></nav></header>
<div class="wrapper">
<span class="icon-close"> <ion-icon name="close"></ion-icon></span>
<div class="form-box login">
<h2>Login</h2>
<form action="#">
<div class="input-box">
<span class="icon">
<ion-icon name="mail-outline"></ion-icon></span>
<input type="text" required>
<label> Username</label></div>
<div class="input-box">
<span class="icon">
<ion-icon name="Lock-closed-outline"></ion-icon></span>
<input type="password" required>
<label>Password</label></div>
<div class="remember-forgot">
<label><input type="checkbox">remember me</label>
<a href="#">Forgot Password</a></div>
<button type="submit" class="btn">Login</button>
<div class="Login-register">
<p> Don't have an account?<a href="#" class="register-link">Register</a> </p>
</div></form></div>
<div class="form-box Register">
<h2>Registration</h2>
<form action="#">
<div class="input-box">
<span class="icon">
<ion-icon name="person-outline"></ion-icon></span>
<input type="text" required>
<label> Username</label></div>
<div class="input-box">
<span class="icon">
<ion-icon name="mail-outline"></ion-icon></span>
<input type="tel" pattern="[0-9]{10}" placeholder="Enter a 10-digit phone number" required required>
<label> Phone</label></div>
<div class="input-box">
<span class="icon">
<ion-icon name="Lock-closed-outline"></ion-icon></span>
<input type="password" required>
<label>Password</label></div>
<div class="remember-forgot">
<label><input type="checkbox">I agree to the termss & conditions</label></div>
<button  type="submit" class="btn" onclick="redirectToHomePage()" >Register</button>
<script>
function redirectToHomePage() {
window.location.href = "Index.html";
}
</script>
<div class="Login-register">
<p> Already have an account?<a href="#" class="login-link">Login</a> </p>
</div></form></div></div>
</body>
<script src="login.js"></script>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</html>
